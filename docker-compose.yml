version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=affpilot_auth
      - JWT_SECRET=your-secret-key-here
      - JWT_EXPIRY=24h
      - SYSTEM_ADMIN_USERNAME=admin
      - SYSTEM_ADMIN_PASSWORD=adminpassword
      - SYSTEM_ADMIN_EMAIL=admin@example.com
      - PASSWORD_SALT=your-password-salt-here
      - EMAIL_VERIFICATION_URL=http://localhost:8080/api/v1/auth/verify
      - EMAIL_FROM=no-reply@example.com
      - EMAIL_HOST=smtp.example.com
      - EMAIL_PORT=587
      - EMAIL_USERNAME=smtp-user
      - EMAIL_PASSWORD=smtp-password
      - EMAIL_SECURE=true
      - VERIFICATION_TOKEN_TTL=5
      - LOG_LEVEL=debug
      - SERVER_PORT=8080

  postgres:
    image: postgres:14-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=affpilot_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_init_schema/up.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
